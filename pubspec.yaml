name: masterdrinks
description: "Sistema POS nativo para eventos musicales"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Base de datos
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.1

  # Servidor HTTP embebido y cliente
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2
  http: ^1.2.2

  # Estado
  provider: ^6.1.4

  # WebView e integración web
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.12.0
  url_launcher: ^6.3.1

  # Utilidades del sistema
  path_provider: ^2.1.5
  wakelock_plus: ^1.3.2
  permission_handler: ^11.4.0
  network_info_plus: ^6.1.2
  share_plus: ^10.1.4
  intl: ^0.19.0
  shared_preferences: ^2.3.3

  # UI y Estética
  google_fonts: ^6.2.1

  # PDF e Impresión
  pdf: ^3.11.3
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/db/pos_evento.db
    - assets/web/
    - assets/web/afiche/
    - assets/web/fonts/
    - assets/web/icons/
    - assets/web/js/
    - assets/web/models/
